<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 120" role="img" aria-label="The CircleVault — Global Payments, Remittances & Yield Ecosystem">
  <defs>
    <filter id="cvNeonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cvNeonGlowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Mark: unchanged neon target (logo colors) -->
  <g filter="url(#cvNeonGlow)" transform="translate(2,10) scale(0.92)">
    <circle cx="50" cy="50" r="44" fill="none" stroke="#00D4FF" stroke-width="3.8" stroke-dasharray="95 42" stroke-linecap="round" transform="rotate(-25 50 50)"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#00D4FF" stroke-width="2.4" stroke-dasharray="78 38" stroke-linecap="round" transform="rotate(55 50 50)" opacity=".9"/>
    <circle cx="50" cy="50" r="23" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".92"/>
    <line x1="50" y1="27" x2="50" y2="39" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50" y1="61" x2="50" y2="73" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="27" y1="50" x2="39" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="61" y1="50" x2="73" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="7.2" fill="#00D4FF"/>
    <circle cx="50" cy="16.5" r="4.8" fill="#FF2A2A" filter="url(#cvNeonGlowSoft)"/>
  </g>
  <!-- Name: HTML wording + font scale (18px→~36); logo colors only -->
  <text x="112" y="58" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="0.4">
    <tspan fill="#FFFFFF">The Circle</tspan><tspan fill="#00D4FF">Vault</tspan>
  </text>
  <!-- Tagline: HTML full line; logo tagline color -->
  <text x="114" y="88" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.14" fill="#FF2A2A">Global Payments, Remittances &amp; Yield Ecosystem</text>
</svg>
